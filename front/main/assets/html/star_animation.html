<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Stars</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            background: linear-gradient(135deg, 
                #f8fff9 0%, 
                #e8f8e8 15%, 
                #d8f3e8 30%, 
                #c8ede8 45%, 
                #d8f3e8 60%, 
                #e8f8e8 75%, 
                #f8fff9 100%);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        #canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            cursor: pointer;
        }

        .info {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, rgba(255,255,255,0.9) 0%, rgba(255,255,255,0.7) 100%);
            padding: 12px 24px;
            border-radius: 24px;
            color: rgba(0, 56, 41, 0.8);
            font-size: 14px;
            font-weight: 500;
            text-align: center;
            pointer-events: none;
            z-index: 10;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 20px rgba(0, 56, 41, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.8);
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div class="info">탭하여 별을 만들어보세요 ✨</div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;
        
        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });

        class Star {
            constructor(x, y, isUserCreated = false) {
                this.x = x;
                this.y = y;
                this.size = isUserCreated ? Math.random() * 8 + 8 : Math.random() * 5 + 3;
                this.baseSize = this.size;
                this.speedX = (Math.random() - 0.5) * (isUserCreated ? 3 : 1);
                this.speedY = isUserCreated ? Math.random() * 2 + 1 : Math.random() * 0.5 + 0.5;
                this.opacity = 1;
                this.twinkle = Math.random() * Math.PI * 2;
                this.twinkleSpeed = Math.random() * 0.05 + 0.02;
                this.color = this.getRandomColor();
                this.rotation = Math.random() * Math.PI * 2;
                this.rotationSpeed = (Math.random() - 0.5) * 0.05;
                this.gravity = 0.05;
                this.bounce = 0.7;
                this.life = 1;
                this.fadeRate = isUserCreated ? 0.002 : 0.001;
            }

            getRandomColor() {
                const colors = [
                    { r: 255, g: 215, b: 100 }, // 골드
                    { r: 255, g: 180, b: 220 }, // 연분홍
                    { r: 150, g: 220, b: 255 }, // 하늘색
                    { r: 180, g: 255, b: 180 }, // 연두색
                    { r: 200, g: 240, b: 255 }, // 아이스 블루
                    { r: 255, g: 220, b: 150 }, // 피치
                    { r: 230, g: 190, b: 255 }, // 라벤더
                    { r: 255, g: 240, b: 200 }, // 크림
                ];
                return colors[Math.floor(Math.random() * colors.length)];
            }

            update() {
                this.speedY += this.gravity;
                this.x += this.speedX;
                this.y += this.speedY;
                this.rotation += this.rotationSpeed;
                this.twinkle += this.twinkleSpeed;
                this.life -= this.fadeRate;

                // 벽 충돌
                if (this.x < this.size || this.x > width - this.size) {
                    this.speedX *= -this.bounce;
                    this.x = this.x < this.size ? this.size : width - this.size;
                }

                // 바닥 충돌
                if (this.y > height - this.size) {
                    this.speedY *= -this.bounce;
                    this.speedX *= 0.95; // 마찰
                    this.y = height - this.size;
                    
                    if (Math.abs(this.speedY) < 0.5) {
                        this.speedY = 0;
                    }
                }

                // 천장 충돌
                if (this.y < this.size) {
                    this.speedY *= -this.bounce;
                    this.y = this.size;
                }

                // 반짝임 효과
                this.size = this.baseSize + Math.sin(this.twinkle) * (this.baseSize * 0.3);
                this.opacity = Math.max(0, this.life);
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);
                
                const alpha = this.opacity * (0.8 + Math.sin(this.twinkle) * 0.2);
                
                // 더 큰 외곽 빛 효과 (프리미엄 글로우)
                const outerGradient = ctx.createRadialGradient(0, 0, 0, 0, 0, this.size * 3);
                outerGradient.addColorStop(0, `rgba(${this.color.r}, ${this.color.g}, ${this.color.b}, ${alpha * 0.4})`);
                outerGradient.addColorStop(0.3, `rgba(${this.color.r}, ${this.color.g}, ${this.color.b}, ${alpha * 0.2})`);
                outerGradient.addColorStop(1, `rgba(${this.color.r}, ${this.color.g}, ${this.color.b}, 0)`);
                
                ctx.fillStyle = outerGradient;
                ctx.fillRect(-this.size * 3, -this.size * 3, this.size * 6, this.size * 6);
                
                // 별 빛 효과
                const gradient = ctx.createRadialGradient(0, 0, 0, 0, 0, this.size * 2);
                gradient.addColorStop(0, `rgba(${this.color.r}, ${this.color.g}, ${this.color.b}, ${alpha})`);
                gradient.addColorStop(0.5, `rgba(${this.color.r}, ${this.color.g}, ${this.color.b}, ${alpha * 0.5})`);
                gradient.addColorStop(1, `rgba(${this.color.r}, ${this.color.g}, ${this.color.b}, 0)`);
                
                ctx.fillStyle = gradient;
                ctx.fillRect(-this.size * 2, -this.size * 2, this.size * 4, this.size * 4);

                // 별 그리기 (더 부드러운 그라데이션)
                const starGradient = ctx.createRadialGradient(0, 0, 0, 0, 0, this.size);
                starGradient.addColorStop(0, `rgba(255, 255, 255, ${alpha})`);
                starGradient.addColorStop(0.3, `rgba(${this.color.r}, ${this.color.g}, ${this.color.b}, ${alpha})`);
                starGradient.addColorStop(1, `rgba(${Math.max(this.color.r - 50, 0)}, ${Math.max(this.color.g - 50, 0)}, ${Math.max(this.color.b - 50, 0)}, ${alpha * 0.8})`);
                
                ctx.fillStyle = starGradient;
                ctx.beginPath();
                for (let i = 0; i < 5; i++) {
                    const angle = (i * 4 * Math.PI) / 5;
                    const x = Math.cos(angle) * this.size;
                    const y = Math.sin(angle) * this.size;
                    if (i === 0) {
                        ctx.moveTo(x, y);
                    } else {
                        ctx.lineTo(x, y);
                    }
                }
                ctx.closePath();
                ctx.fill();

                // 중앙 하이라이트 (더 강한 빛)
                const highlightGradient = ctx.createRadialGradient(0, 0, 0, 0, 0, this.size * 0.4);
                highlightGradient.addColorStop(0, `rgba(255, 255, 255, ${alpha})`);
                highlightGradient.addColorStop(1, `rgba(255, 255, 255, 0)`);
                
                ctx.fillStyle = highlightGradient;
                ctx.beginPath();
                ctx.arc(0, 0, this.size * 0.4, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();
            }

            isDead() {
                return this.life <= 0;
            }

            collidesWith(other) {
                const dx = this.x - other.x;
                const dy = this.y - other.y;
                const distance = Math.sqrt(dx * dx + dy * dy);
                return distance < this.size + other.size;
            }

            resolveCollision(other) {
                const dx = other.x - this.x;
                const dy = other.y - this.y;
                const distance = Math.sqrt(dx * dx + dy * dy);
                
                if (distance === 0) return;

                // 충돌 방향
                const nx = dx / distance;
                const ny = dy / distance;

                // 상대 속도
                const dvx = other.speedX - this.speedX;
                const dvy = other.speedY - this.speedY;
                const dvn = dvx * nx + dvy * ny;

                if (dvn > 0) return; // 멀어지는 중

                // 충돌 해결
                const impulse = (2 * dvn) / 2;
                this.speedX += impulse * nx;
                this.speedY += impulse * ny;
                other.speedX -= impulse * nx;
                other.speedY -= impulse * ny;

                // 겹침 해결
                const overlap = (this.size + other.size - distance) / 2;
                this.x -= overlap * nx;
                this.y -= overlap * ny;
                other.x += overlap * nx;
                other.y += overlap * ny;
            }
        }

        const stars = [];
        const maxStars = 100;

        // 초기 별 생성
        function createInitialStars() {
            for (let i = 0; i < 20; i++) {
                stars.push(new Star(
                    Math.random() * width,
                    Math.random() * height * 0.3,
                    false
                ));
            }
        }

        createInitialStars();

        // 주기적으로 떨어지는 별
        setInterval(() => {
            if (stars.length < maxStars) {
                stars.push(new Star(
                    Math.random() * width,
                    -20,
                    false
                ));
            }
        }, 2000);

        // 터치/클릭 이벤트
        function createStarAtPosition(x, y) {
            if (stars.length < maxStars * 2) {
                for (let i = 0; i < 3; i++) {
                    stars.push(new Star(
                        x + (Math.random() - 0.5) * 20,
                        y + (Math.random() - 0.5) * 20,
                        true
                    ));
                }
            }
        }

        canvas.addEventListener('click', (e) => {
            createStarAtPosition(e.clientX, e.clientY);
        });

        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            for (let touch of e.touches) {
                createStarAtPosition(touch.clientX, touch.clientY);
            }
        });

        // 애니메이션 루프
        function animate() {
            ctx.fillStyle = 'rgba(240, 255, 244, 0.15)';
            ctx.fillRect(0, 0, width, height);

            // 별 업데이트 및 그리기
            for (let i = stars.length - 1; i >= 0; i--) {
                stars[i].update();
                stars[i].draw();

                if (stars[i].isDead()) {
                    stars.splice(i, 1);
                    continue;
                }

                // 충돌 감지
                for (let j = i - 1; j >= 0; j--) {
                    if (stars[i].collidesWith(stars[j])) {
                        stars[i].resolveCollision(stars[j]);
                    }
                }
            }

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
